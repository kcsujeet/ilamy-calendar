name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # Biome is a standalone binary that lints/formats source directly, so this
      # job needs neither `bun install` nor a build. Runs in parallel with the rest.
      - name: Lint & format
        run: bun run check

  build-test:
    name: Build, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: the recurrence package and demo resolve @ilamy/calendar
      # through its built dist/*.d.ts, so type-check and test depend on it.
      - name: Build
        run: bun run build

      # The published declarations, checked as a strict consumer would
      # (skipLibCheck: false). The source type-check cannot see a
      # declaration-bundling bug (#302).
      - name: Check published types
        run: bun run check:dist-types

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/e2e/package.json', 'bun.lock') }}

      # `--with-deps` brings the system libraries the browser needs, which a
      # bare runner does not have. When the browser binary is restored from
      # cache, `install-deps` installs only the OS libs and skips the download.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/e2e

      - name: Build E2E harness and demo
        run: bun run --filter '@ilamy/calendar' build && bun run --filter '@ilamy/e2e' --filter '@ilamy/demo' build

      - name: E2E (shard ${{ matrix.shard }}/4)
        run: bunx playwright test --shard=${{ matrix.shard }}/4
        working-directory: apps/e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/e2e/playwright-report/
          retention-days: 7

      # Traces are recorded on the retry, and a failure is hard to read without
      # them.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: apps/e2e/test-results/
          retention-days: 7

  a11y:
    name: Accessibility (Axe)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/e2e/package.json', 'bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: apps/e2e

      - name: Build E2E harness and demo
        run: bun run --filter '@ilamy/calendar' build && bun run --filter '@ilamy/e2e' --filter '@ilamy/demo' build

      - name: Run accessibility & axe-core audits
        run: bun run e2e:a11y

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  fallow:
    name: Fallow analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the action can resolve the PR base commit and diff
          # changed files; a shallow clone omits the base ref.
          fetch-depth: 0

      # Official composite action (prebuilt Rust binary, no Node runtime). Reads
      # fallow.toml. Defaults applied: gate=new-only (only findings introduced by
      # the change fail), auto-changed-since=true (PR/push delta scope),
      # fail-on-issues=true (gates the job).
      - name: Run fallow audit
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          version: 3.20.0
          format: human
