# fallow static-analysis config.
#
# Scopes the audit to the shipped library packages. Everything excluded here is
# non-shipped code whose findings are false positives for published packages:
#
#   examples/**   Standalone consumer apps with their own package.json.
#   apps/**       Private playgrounds & E2E harnesses. Never published.

ignorePatterns = ["examples/**", "apps/**", "packages/playground/**"]
entry = [
	"packages/calendar/bunup.config.ts",
	"packages/calendar/scripts/*.ts*",
	"packages/calendar/styles/*.css",
]

# Dependency findings that are false positives of fallow's static view of a
# bundled, hoisted workspace:
ignoreDependencies = [
	"bun-plugin-tailwind",
	"bunup",
	"@happy-dom/global-registrator",
	"@tailwindcss/vite",
	"@testing-library/react",
	"@testing-library/jest-dom",
	"@emotion/react",
	"@emotion/styled",
	"@angular/core",
	"rxjs",
	"svelte",
]

[health]
ignore = ["apps/**", "packages/playground/**"]

[duplicates]
ignore = ["apps/**", "packages/playground/**", "**/*.test.ts", "**/*.test.tsx"]
ignoreImports = true
